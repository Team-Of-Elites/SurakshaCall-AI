- id: secret.direct_otp.v1
  version: 1
  enabled: true
  languages: [en, hi, hi-en]
  description: "Detect direct OTP requests"
  label: SECRET_REQUEST
  severity: 5
  confidence: 0.99
  score_delta: 30
  risk_floor: 85
  cooldown_seconds: 5
  action_code: DO_NOT_SHARE_SECRET
  conditions:
    any:
      - type: concept
        value: OTP
        alias: "direct otp request"
      - type: concept
        value: ONE_TIME_CODE
  exclusions:
    any:
      - type: speech_act
        value: ADVICE
      - type: speech_act
        value: REFUSAL

- id: secret.indirect_code.v1
  version: 1
  enabled: true
  languages: [en, hi, hi-en]
  description: "Detect indirect secret code requests"
  label: SECRET_REQUEST
  severity: 5
  confidence: 0.95
  score_delta: 25
  risk_floor: 80
  action_code: DO_NOT_SHARE_SECRET
  conditions:
    any:
      - type: regex
        value: "(six|6|chhe|छह).{0,20}(digit|code|number|ank|अंक).{0,30}(batao|bataiye|read|tell|share|give|दो|बताओ|बताइए)"
      - type: regex
        value: "(code|number|message|sms|text).{0,20}(aaya|mila|received|आया|मिला).{0,30}(batao|read|tell|share|दो|बताओ)"
  exclusions:
    any:
      - type: speech_act
        value: ADVICE
      - type: speech_act
        value: QUESTION

- id: secret.pin_cvv.v1
  version: 1
