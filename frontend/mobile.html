<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SurakshaCall Security</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
      --accent: #2563eb;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 24px);
      background-image: 
        radial-gradient(circle at 50% 10%, rgba(37, 99, 235, 0.05) 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 60%);
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      margin: 10px auto 0;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 999px;
      width: fit-content;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }

    header .shield { font-size: 16px; }
    header span { font-size: 13px; font-weight: 700; color: var(--text-main); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      text-align: center;
    }

    .title-group h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin: 0 0 8px;
      color: var(--text-main);
    }

    .title-group p {
      font-size: 14px;
      line-height: 1.45;
      color: var(--text-muted);
      margin: 0 0 32px;
      font-weight: 500;
    }

    .mic-button-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .pulse-ring {
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      transform: scale(0.9);
      opacity: 0;
      transition: all 400ms ease;
    }

    .is-listening .pulse-ring {
      animation: pulseGlow 2s infinite ease-out;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    #startBtn {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.35);
      transition: all 200ms cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    #startBtn:active:not(:disabled) {
      transform: scale(0.94);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }

    #startBtn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      box-shadow: none;
      cursor: default;
    }

    .btn-icon {
      font-size: 26px;
    }

    /* Soundwave bars */
    .wave-bar-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 24px;
      margin-bottom: 20px;
      opacity: 0.3;
      transition: opacity 300ms ease;
    }

    .is-listening .wave-bar-container { opacity: 1; }

    .wave-bar {
      width: 4px;
      height: 8px;
      background: var(--green);
      border-radius: 99px;
      transition: height 100ms ease;
    }

    .is-listening .wave-bar:nth-child(1) { animation: wave 1.2s infinite 0.1s ease-in-out; }
    .is-listening .wave-bar:nth-child(2) { animation: wave 1.2s infinite 0.3s ease-in-out; }
    .is-listening .wave-bar:nth-child(3) { animation: wave 1.2s infinite 0.2s ease-in-out; }
    .is-listening .wave-bar:nth-child(4) { animation: wave 1.2s infinite 0.4s ease-in-out; }
    .is-listening .wave-bar:nth-child(5) { animation: wave 1.2s infinite 0.15s ease-in-out; }

    @keyframes wave {
      0%, 100% { height: 6px; }
      50% { height: 22px; }
    }

    .status-card {
      width: 100%;
      padding: 16px 20px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.04);
      transition: all 250ms ease;
    }

    .warning-banner {
      width: 100%;
      margin-top: 14px;
      padding: 18px 20px;
      background: #fef2f2;
      border: 1px solid #fca5a5;
      border-radius: 18px;
      color: #b91c1c;
      font-size: 15px;
      font-weight: 700;
      text-align: left;
      display: none;
      animation: alertSlide 400ms cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 10px 24px rgba(220, 38, 38, 0.1);
    }

    @keyframes alertSlide {
      from { transform: translateY(12px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    footer {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <span class="shield">🛡️</span>
    <span>SurakshaCall iOS Companion</span>
  </header>

  <main>
    <div class="title-group">
      <h1>Call Protection</h1>
      <p>Streams phone audio to your laptop. AI behavioral analysis runs 100% on-device.</p>
    </div>

    <div class="mic-button-container" id="micWrapper">
      <div class="pulse-ring"></div>
      <button id="startBtn">
        <span class="btn-icon">🎙️</span>
        <span id="btnText">Listen</span>
      </button>
    </div>

    <div class="wave-bar-container">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <div class="status-card" id="statusEl">Initializing secure connection...</div>
    <div class="warning-banner" id="warningEl"></div>
  </main>

  <footer>
    SurakshaCall AI • 100% On-Device Protection
  </footer>

  <script>
    const SID = "__SESSION_ID__";
    const statusEl = document.getElementById("statusEl");
    const warningEl = document.getElementById("warningEl");
    const startBtn = document.getElementById("startBtn");
    const btnText = document.getElementById("btnText");
    const micWrapper = document.getElementById("micWrapper");

    let ws = null;
    let audioCtx = null;
    let stream = null;
    let isStreaming = false;
    let frameCount = 0;
    let keepAlive = null;

    function connect() {
      if (ws) {
        ws.onopen = null;
        ws.onclose = null;
        ws.onerror = null;
        if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) {
          ws.close();
        }
      }
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + window.location.host + "/ws/mobile/" + SID);
      ws.binaryType = "arraybuffer";

      ws.onopen = () => {
        statusEl.textContent = "Ready. Tap Listen to begin.";
        startBtn.disabled = false;
        keepAlive = setInterval(() => {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({type: "ping"}));
          }
        }, 10000);
      };

      ws.onclose = () => {
        if (keepAlive) clearInterval(keepAlive);
        if (isStreaming) {
          statusEl.textContent = "Reconnecting to laptop...";
          setTimeout(connect, 500);
        } else {
          statusEl.textContent = "Disconnected. Refresh page.";
          startBtn.disabled = true;
        }
      };

      ws.onerror = () => {
        if (!isStreaming) {
          statusEl.textContent = "Connection error. Refresh page.";
          startBtn.disabled = true;
        }
      };

      ws.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === "safety_warning" || msg.type === "decision_update") {
            warningEl.style.display = "block";
            warningEl.textContent = "⚠️ " + (msg.payload.message || msg.payload.action || "Scam Tactic Warning");
          }
        } catch(_) {}
      };
    }

    connect();

    startBtn.addEventListener("click", async () => {
      if (isStreaming) return;
      try {
        startBtn.disabled = true;
        btnText.textContent = "Connecting";
        statusEl.textContent = "Requesting mic permission...";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("Microphone requires HTTPS. Please start backend with SSL certificates or open via https://");
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        await audioCtx.resume();

        const source = audioCtx.createMediaStreamSource(stream);
        const processor = audioCtx.createScriptProcessor(4096, 1, 1);
        source.connect(processor);
        processor.connect(audioCtx.destination);

        isStreaming = true;
        frameCount = 0;
        micWrapper.classList.add("is-listening");
        btnText.textContent = "Active";
        startBtn.style.background = "linear-gradient(135deg, #ff3b30 0%, #d70015 100%)";
        startBtn.style.boxShadow = "0 12px 36px rgba(255, 59, 48, 0.4)";
        statusEl.textContent = "Streaming live audio to laptop";

        processor.onaudioprocess = (event) => {
          if (!ws || ws.readyState !== WebSocket.OPEN) return;
          const input = event.inputBuffer.getChannelData(0);
          const ratio = audioCtx.sampleRate / 16000;
          const outLen = Math.floor(input.length / ratio);
          const out = new Float32Array(outLen);
          for (let i = 0; i < outLen; i++) out[i] = input[Math.floor(i * ratio)];
          const pcm = new Int16Array(outLen);
          for (let i = 0; i < outLen; i++) {
            const s = Math.max(-1, Math.min(1, out[i]));
            pcm[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
          }
          try { ws.send(pcm.buffer); } catch(_) {}
          frameCount++;
          if (frameCount % 30 === 0) statusEl.textContent = "Streaming live: " + frameCount + " frames";
        };

      } catch (err) {
        statusEl.textContent = "Mic error: " + (err.message || err.name || "unknown");
        startBtn.disabled = false;
        btnText.textContent = "Listen";
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden && audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    });
  </script>
</body>
</html>
